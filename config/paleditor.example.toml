# paleditor configuration.
#
# Copy to /etc/paleditor/paleditor.toml and edit. Validate before restarting:
#     paleditor check-config -c /etc/paleditor/paleditor.toml
#
# The loader refuses to start on anything unsafe rather than falling back to a
# permissive default, because the write path can modify the world.

[server]
# One entry per interface to listen on.
# 127.0.0.1 is local only; a VPN address exposes it to the friend group.
listen = ["127.0.0.1:8080", "100.64.0.3:8080"]
allow_public = false   # must be true to bind 0.0.0.0 or a WAN address

[auth]
# Generate with: paleditor hash-password
# There is no default password and no first-run open window.
password_hash = "$argon2id$v=19$m=65536,t=3,p=4$REPLACE-ME"
owner_password_hash = "$argon2id$v=19$m=65536,t=3,p=4$REPLACE-ME-TOO"
session_days = 30

[palworld]
save_dir = "/home/palworld/Pal/Saved/SaveGames/0/<world-id>"
server_unit = "palworld.service"
rcon_host = "127.0.0.1"
rcon_port = 25575
rcon_password_file = "/etc/paleditor/rcon.secret"
# "palworld" is the real backend; "fixture" reads a JSON world and is for
# development only.
save_backend = "palworld"

# This server's saves use the Oodle (PlM) container, which needs a libooz
# build to decompress. Left unset, a short list of standard locations is
# searched. The library is not shipped with paleditor.
# oodle_library = "/opt/paleditor/lib/libooz.so"

# Read the newest completed snapshot from backup/world/ rather than the live
# Level.sav. The server rewrites the live file roughly every 30 seconds, and a
# read landing mid-write returns a torn file.
read_from_backup = true

# paleditor reads PlM but can only write PlZ (zlib), so applying an edit
# changes the save's container format. The maintenance window refuses to run
# until this is true. Prove it first:
#     paleditor check-write --save-dir <dir> --out /tmp/Level.plz.sav
# then load that file on a COPY of the world and confirm the game accepts it.
plz_write_confirmed = false

[maintenance]
schedule = "0 5 * * *"
shutdown_warning_seconds = 60
backup_dir = "/var/lib/paleditor/backups"
backup_count = 10
# How long to wait for the server process to actually exit after the countdown.
# The window does not trust the countdown; it polls for the PID to disappear.
shutdown_timeout_seconds = 180
enabled = true

# The exclusive window lock. Left unset it sits beside the database, which is
# usually what you want; set it only to put the lock somewhere else.
# lock_file = "/var/lib/paleditor/maintenance.lock"

[ingest]
# How often to reread the world. Without this the database only changes when
# somebody runs 'paleditor ingest' by hand: the maintenance window reingests as
# its verification step, but it returns early when the queue is empty, which is
# most nights.
#
# A pass is skipped when the save is byte-identical to the last one read, so an
# idle world costs a checksum rather than a parse. Minimum 60 seconds; the
# server only writes a new snapshot every 30 or so.
enabled = true
interval_seconds = 300

[database]
path = "/var/lib/paleditor/paleditor.db"
